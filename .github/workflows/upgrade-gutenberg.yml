name: Upgrade Gutenberg

on:
  workflow_dispatch:
#   schedule:
#     - cron: "0 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['12']
    steps:
    - name: Git Checkout Gutenberg
      run: |
        git clone "$GITHUB_SERVER_URL/WordPress/gutenberg" gutenberg
        cd gutenberg
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v2
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'gutenberg'
    - run: npm --prefix './gutenberg' ci
    - run: npm --prefix './gutenberg' run build
    - run: npm --prefix './gutenberg' link
    - name: Git Checkout
      run: |
        git clone "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" laraberg
        cd laraberg
        git checkout -f "$GITHUB_SHA"
    - run: |
        cd laraberg
        npm install
        npm link gutenberg
        npm run build
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v3
      with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update-gutenberg
          commit-message: Upgrade Gutenberg
          title: Upgrade Gutenberg
          path: laraberg
          base: updates

